# Fast checks on every change:
#   - the third-party mirror is byte-for-byte unchanged;
#   - the Lean sources and the build configuration match the recorded digests;
#   - every generated file can be regenerated byte for byte from its inputs, and the plan used by the
#     proof is the original plan with codes reordered within classes only.
name: Repository integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: claude_independent_review/lean_formal/lean_project
  EXPECTED_DIGEST: a179bd53953a21dc4b38489f9cc13e10c698a23b034555ae413b85e68ef191d2
  EXPECTED_ALL_DIGEST: 9ec53ef1a446d582e59729f97eea4f9f54e2938466acbdcce84216b8075fd7e6

jobs:
  integrity:
    # Pull requests from branches of this repository are already checked by their push run.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Third-party mirror is unchanged
        working-directory: third_party
        run: |
          sha256sum --check --strict --quiet qianwan-dangliang.SHA256SUMS
          # No file may be added to or removed from the mirror either.
          diff <(sed -E 's/^[0-9a-f]{64} [ *]//' qianwan-dangliang.SHA256SUMS | LC_ALL=C sort) \
               <(find qianwan-dangliang -type f | LC_ALL=C sort)
          echo "All $(wc -l < qianwan-dangliang.SHA256SUMS) mirrored files match their checksums."

      - name: Lean sources and build configuration match the recorded digests
        run: |
          python3 -I claude_independent_review/lean_formal/tools/manifest.py "$PROJECT" manifest.json
          python3 -I -c 'import json, os, sys
          d = json.load(open("manifest.json"))
          print("lean_set_sha256", d["lean_set_sha256"]); print("all_sha256     ", d["all_sha256"])
          sys.exit(d["lean_set_sha256"] != os.environ["EXPECTED_DIGEST"] or d["all_sha256"] != os.environ["EXPECTED_ALL_DIGEST"])'

  regeneration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Regenerate every generated file and compare it with the committed one
        run: python3 -I claude_independent_review/lean_formal/tools/check_regeneration.py
